openapi: 3.0.1
info:
  title: Artsdata MCP Server API
  version: v1
servers:
  - url: /
paths:
  /search-entities:
    get:
      summary: Search Artsdata entities
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
        - in: query
          name: lang
          required: false
          schema:
            type: string
            enum: [en, fr]
            default: en
      responses:
        "200":
          description: Entity search results
  /entities:
    get:
      summary: Fetch statements for an entity
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: lang
          required: false
          schema:
            type: string
            enum: [en, fr]
            default: en
      responses:
        "200":
          description: Formatted statements
  /mcp:
    post:
      summary: MCP endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                id:
                  oneOf:
                    - type: integer
                    - type: string
                    - type: "null"
                method:
                  type: string
                  enum: ["tools/list", "tool/list", "tools/call", "tool/call"]
                params:
                  type: object
                  additionalProperties: true
              required: [jsonrpc, id, method, params]
      responses:
        "200":
          description: Tool list
        "404":
          description: Method not found
